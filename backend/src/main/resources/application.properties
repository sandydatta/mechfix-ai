server.port=8080

# LangChain4j Groq LPU Configuration (OpenAI Compatible Endpoint)
langchain4j.open-ai.chat-model.base-url=https://api.groq.com/openai/v1
langchain4j.open-ai.chat-model.api-key=${GROQ_API_KEY:gsk_demo}
langchain4j.open-ai.chat-model.model-name=${GROQ_MODEL_NAME:llama-3.2-11b-vision-preview}
langchain4j.open-ai.chat-model.temperature=0.2
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# Chroma DB Vector Database
chroma.url=${CHROMA_URL:http://localhost:8000}
chroma.collection-name=agent_knowledge_base
